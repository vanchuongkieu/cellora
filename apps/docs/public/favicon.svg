<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Cellora</title>
  <rect width="512" height="512" fill="#151515"/>
  <g fill="#fff">
    <rect x="142" y="106" width="60" height="60" rx="10"/>
    <rect x="262" y="106" width="60" height="60" rx="10"/>
    <rect x="202" y="166" width="180" height="60" rx="10"/>
    <rect x="142" y="226" width="180" height="60" rx="10"/>
